<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Cadastro de Discos - Vinil & CD</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header>
    <h1>Cadastro de Discos (Vinil & CD)</h1>
  </header>

  <main>
    <section class="form-section">
      <h2 id="form-title">Cadastrar novo disco</h2>
      <form id="disco-form">
        <input type="hidden" id="disco-id" />
        <div class="row">
          <label>Título</label>
          <input id="titulo" required />
        </div>
        <div class="row">
          <label>Artista</label>
          <input id="artista" required />
        </div>
        <div class="row">
          <label>Ano</label>
          <input id="ano" type="number" min="1800" max="2100" />
        </div>
        <div class="row">
          <label>Gênero</label>
          <input id="genero" />
        </div>
        <div class="row">
          <label>Formato</label>
          <select id="formato" required>
            <option value="">-- selecione --</option>
            <option value="Vinil">Vinil</option>
            <option value="CD">CD</option>
          </select>
        </div>
        <div class="row">
          <label>Preço</label>
          <input id="preco" type="number" step="0.01" />
        </div>
        <div class="actions">
          <button type="submit" id="salvar">Salvar</button>
          <button type="button" id="cancelar">Cancelar</button>
        </div>
      </form>
    </section>

    <section class="list-section">
      <h2>Lista de Discos</h2>
      <table id="tabela-discos">
        <thead>
          <tr>
            <th>Título</th>
            <th>Artista</th>
            <th>Ano</th>
            <th>Gênero</th>
            <th>Formato</th>
            <th>Preço</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
